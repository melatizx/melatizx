name: Update GitHub status

on:
  schedule:
    # cron do GitHub Actions roda em UTC.
    # 00:00 no horário de Brasília (UTC-3) = 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: # permite rodar manualmente também, pelo botão "Run workflow"

permissions:
  contents: write # necessário pra poder commitar/push de volta no repo

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar github-status.svg / .txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # token automático do Actions, evita rate limit
        run: |
          python3 generate-github-status.py --input github.json --token "$GH_TOKEN"

      - name: Commitar alterações (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-status.svg github-status.txt
          git diff --staged --quiet || git commit -m "chore: atualiza status do GitHub"
          git push
