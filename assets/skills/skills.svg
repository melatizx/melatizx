    <style>
      .term-bg { fill: #0d1117; }
      .term-border { fill: none; stroke: #21262d; stroke-width: 1; }
      text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .line { opacity: 0; }

      @keyframes typeIn {
        from { opacity: 0; transform: translateY(2px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .line { animation: typeIn 0.3s ease-out forwards; }
      .cursor-block { animation: blink 1s step-end infinite; }
    </style>

